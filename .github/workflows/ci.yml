name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Type-check · Test · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (strict)
        run: npx tsc --noEmit

      - name: Unit tests (engine, parser, ranking, group, state, scenarios)
        run: npx jest --ci

      - name: ESLint
        run: npm run lint
